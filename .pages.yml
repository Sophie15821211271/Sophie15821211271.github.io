media:
  input: public/media
  output: /media
content:
  - name: site
    label: 站点与个人资料
    type: file
    path: src/site.json
    format: json
    fields:
      - {name: title, label: 站点名称, type: string, required: true}
      - {name: name, label: 昵称, type: string, required: true}
      - {name: description, label: 首页介绍, type: text, required: true}
      - {name: signature, label: 个性签名, type: text}
      - {name: songId, label: 网易云音乐歌曲 ID, type: string}
      - {name: quote, label: 首页摘句, type: text}
      - {name: quoteBackground, label: 座右铭卡片背景图, type: image}
      - {name: visitsEndpoint, label: 访客统计服务地址, type: string}
      - {name: background, label: 首页背景, type: image}
      - {name: avatar, label: 头像, type: image}
      - {name: songAudio, label: 已获授权的主题曲音频链接, type: string}
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      primary: title
      fields: [title, date, category, draft]
    fields:
      - {name: title, label: 标题, type: string, required: true}
      - {name: date, label: 日期, type: date, required: true}
      - {name: category, label: 分类, type: string, required: true}
      - {name: tags, label: 标签, type: string, list: true}
      - {name: description, label: 摘要, type: text, required: true}
      - {name: cover, label: 封面, type: image}
      - {name: featured, label: 精选, type: boolean}
      - {name: draft, label: 草稿（内容仍保存在公开仓库）, type: boolean}
      - {name: body, label: 正文, type: rich-text}
  - name: journal
    label: 项目、说说、相册与友链
    type: file
    path: src/journal.json
    format: json
    fields:
      - name: projects
        label: 项目
        type: object
        list: true
        fields:
          - {name: title, label: 名称, type: string, required: true}
          - {name: description, label: 介绍, type: text}
          - {name: date, label: 日期, type: date, required: true}
          - {name: url, label: 项目链接, type: string}
          - {name: cover, label: 项目封面, type: image}
      - name: moments
        label: 说说
        type: object
        list: true
        fields:
          - {name: title, label: 标题, type: string, required: true}
          - {name: description, label: 内容, type: text, required: true}
          - {name: date, label: 日期, type: date, required: true}
      - name: albums
        label: 相册
        type: object
        list: true
        fields:
          - {name: title, label: 相册名, type: string, required: true}
          - {name: description, label: 说明, type: text}
          - {name: images, label: 图片, type: image, list: true, required: true}
      - name: friends
        label: 友情链接
        type: object
        list: true
        fields:
          - {name: title, label: 站点名, type: string, required: true}
          - {name: description, label: 介绍, type: text}
          - {name: url, label: 网站链接, type: string, required: true}
